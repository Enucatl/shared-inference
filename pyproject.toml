[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shared-inference"
version = "0.1.0"
description = "Small OpenAI-compatible inference client shared by local services"
requires-python = ">=3.14"
dependencies = ["niquests>=3.0", "opentelemetry-api>=1.28"]

[tool.setuptools.packages.find]
where = ["src"]

[dependency-groups]
dev = [
    "opentelemetry-sdk>=1.28",
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
markers = ["live: requires configured inference endpoints"]
